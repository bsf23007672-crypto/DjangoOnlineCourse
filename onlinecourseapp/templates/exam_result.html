<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow text-center">
        <div class="card-body">

            {% if score == total_questions and total_questions > 0 %}

                <h1 class="text-success">
                    Congratulations!
                </h1>

                <p class="lead">
                    You successfully completed the exam.
                </p>

            {% else %}

                <h1>Exam Results</h1>

            {% endif %}

            <hr>

            <h3>
                Score: {{ score }} / {{ total_questions }}
            </h3>

            <p class="mt-3">
                You answered {{ score }} question(s) correctly
                out of {{ total_questions }}.
            </p>

            <a href="{% url 'exam' %}" class="btn btn-primary mt-3">
                Retake Exam
            </a>

        </div>
    </div>

</div>

</body>
</html>
